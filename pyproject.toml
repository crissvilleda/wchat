[project]
name = "wchatv0"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.5",
    "azure-functions>=2.0.0",
    "azure-storage-blob>=12.28.0",
    "fastapi>=0.136.0",
    "google-auth>=2.38",
    "orjson>=3.11.8",
    "pip>=26.0.1",
    "pydantic>=2.12.5",
    "requests>=2.32",
    "supertokens-python>=0.31.2",
    "twilio>=9.10.4",
]

[dependency-groups]
dev = [
    "aioresponses>=0.7.8",
    "httpx>=0.28.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
